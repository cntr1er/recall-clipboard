name: Release

on:
  push:
    tags: ["v*"]
  # Manual re-run for an existing tag (Actions tab → Release → Run workflow).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Builds the NSIS installer and attaches it to a draft GitHub release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Recall Clipboard ${{ inputs.tag || github.ref_name }}
          releaseBody: See the README for what's new. Download the `-setup.exe` below to install.
          releaseDraft: true
